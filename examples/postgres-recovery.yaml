# PostgreSQL logical dump + a containerized app, both started on an isolated --internal network.
# Create the dump in your backup job, e.g.:  pg_dump -U app app > /srv/app/db/dump.sql
apiVersion: restoreproof.io/v1alpha1
kind: RecoveryTest
metadata:
  name: postgres-app
  description: App database + web front end
spec:
  source:
    adapter: restic
    recoveryPoint: latest       # resolved to an immutable snapshot id before the test starts
  restore:
    maxDurationSeconds: 1800
    basePath: srv/app
  resources:
    databases:
      - name: db
        version: "16"           # match your production major version
        dumpPath: db/dump.sql
        format: plain           # or "custom" for pg_dump -Fc
        database: app
        createRoles: [app]      # roles referenced by OWNER TO / GRANT in the dump
        limits: {memoryMb: 1024, cpus: 1}
    services:
      - name: web
        image: nginx:1.27-alpine
        port: 80
        mounts: [{from: www, to: /usr/share/nginx/html, readOnly: true}]
  objectives: {rpoHours: 24, rtoMinutes: 30}
  checks:
    - {type: file_exists, path: db/dump.sql, kind: file}
    - {type: postgres_table_exists, target: db, table: public.users}
    # Examples only: write invariants that hold for YOUR data. Some installs legitimately have zero rows.
    - {type: postgres_row_count, target: db, table: public.users, min: 1}
    - {type: postgres_query, target: db, name: recent-activity,
       query: "SELECT max(created_at) > now() - interval '7 days' FROM public.users", expect: true, required: false}
    - {type: http, target: web, path: /, expectedStatus: 200, bodyContains: "<title>"}
