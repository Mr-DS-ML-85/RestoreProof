[project]
name = "restoreproof"
version = "0.3.0"
description = "Self-hosted continuous backup restore verification with durable evidence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "cryptography>=43,<47",
  "croniter>=3.0,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
restoreproof = "restoreproof.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restoreproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs restic binary",
  "docker: needs a working Docker daemon",
]

[tool.ruff]
line-length = 110
src = ["src"]
extend-exclude = ["src/restoreproof/migrations/versions"]

[tool.ruff.lint]
select = ["E9", "F", "B", "S102", "S307", "S602", "S604", "S605", "S606"]
ignore = ["B008"]  # FastAPI Depends() in defaults
